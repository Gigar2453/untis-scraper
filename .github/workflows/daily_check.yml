name: Daily Untis Check
on:
  schedule:
    - cron: '30 5 * * 1-5' # Montag bis Freitag um 05:30 UTC (ca. 06:30 Uhr deutsche Zeit)
  workflow_dispatch: # Erlaubt es uns, das Skript sofort per Hand zu testen

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install webuntis-fetcher
      - name: Run Script
        env:
          UNTIS_SERVER: ${{ secrets.UNTIS_SERVER }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python scraper.py
