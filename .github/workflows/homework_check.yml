name: Daily Homework Check
on:
  schedule:
    # Geänderte Startzeit: 11:15 UTC (verhindert Staus zur vollen Stunde)
    # Entspricht ca. 12:15 Uhr Winterzeit / 13:15 Uhr Sommerzeit
    - cron: '15 11 * * 1-5' 
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up German Locale
        run: |
          sudo locale-gen de_DE.UTF-8
          sudo update-locale LANG=de_DE.UTF-8
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      # NEU: Dieser Schritt speichert den Playwright-Browser im Cache
      - name: Cache Playwright Browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
          
      - name: Install dependencies
        # Wir installieren Playwright und die System-Abhängigkeiten
        run: |
          pip install playwright
          playwright install --with-deps chromium
        
      - name: Run Script
        env:
          UNTIS_SERVER: ${{ secrets.UNTIS_SERVER }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python homework_scraper.py
